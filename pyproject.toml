[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-kb"
version = "0.1.0"
description = "Smart parking enterprise knowledge base RAG assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "sentence-transformers>=3.0",
  "qdrant-client>=1.12",
  "jieba>=0.42",
  "rank-bm25>=0.2",
  "openai>=1.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rapidocr-onnxruntime>=1.3",
  "onnxruntime>=1.18",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["slow: tests that load real models or OCR engines"]
