<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧停车知识库问答</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>智慧停车 · 企业知识库</h1>
      <p class="subtitle">混合检索 + 重排 + 带引用回答</p>
    </div>
    <span id="doc-count" class="doc-count">知识库加载中…</span>
  </header>

  <main id="messages" class="messages">
    <section class="message assistant">
      <div class="bubble">
        你好，我可以回答停车收费、月租办理、设备运维、客服规范等问题。
        回答会标注引用出处；资料中没有的内容我会明确说明。
      </div>
    </section>
  </main>

  <form id="composer" class="composer">
    <input id="question" type="text" placeholder="输入问题，例如：临时停车怎么收费？" autocomplete="off">
    <button type="submit">提问</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
